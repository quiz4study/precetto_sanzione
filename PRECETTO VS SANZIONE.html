<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precetto vs Sanzione</title>
    <!-- Caricamento di Tailwind CSS per lo styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Stile personalizzato per il font e il body */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .segment {
            cursor: grab; /* Indica che l'elemento è trascinabile */
            transition: all 0.2s ease-in-out;
            padding: 10px 16px; /* Aumentato il padding per maggiore leggibilità */
            border-radius: 12px;
            font-size: 1.25rem; /* Testo più grande */
            line-height: 1.75rem;
            border: 2px solid transparent;
            display: block;
            margin: 12px auto; /* Centra */
            max-width: 95%;
            text-align: center;
            box-shadow: 0 6px 10px -2px rgba(0, 0, 0, 0.1), 0 3px 6px -3px rgba(0, 0, 0, 0.08); /* Ombra più pronunciata */
        }
        .segment-default {
            background-color: #eef2ff; /* indigo-50 */
            color: #1e3a8a; /* indigo-900 */
        }
        .segment-default:hover {
            background-color: #e0e7ff; /* indigo-100 */
        }
        .segment-error {
            background-color: #ef4444; 
            color: white;
            border-color: #dc2626;
            cursor: default;
        }
        .drop-target {
            min-height: 90px; /* Assicura un'area di rilascio sufficiente */
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px dashed transparent;
            font-size: 1.5rem; /* Testo dei bottoni più grande */
        }
        .target-ready {
            border-color: #93c5fd; /* blue-300 */
            background-color: #dbeafe; /* blue-100 */
        }
        .target-filled {
            background-color: #10b981; /* green-500 */
            color: white;
            border-color: #059669;
            pointer-events: none; /* Disabilita il drop */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Contenitore Principale del Quiz -->
    <div id="quiz-container" class="bg-white p-8 md:p-12 rounded-xl shadow-2xl w-full max-w-xl transition-all duration-300">
        <h1 class="text-3xl font-extrabold text-center text-indigo-700 mb-6 border-b pb-3">
            Precetto vs. Sanzione
        </h1>
        <p class="text-center text-gray-600 mb-8 font-medium text-lg">
            **Trascina** ogni segmento sulla categoria corretta.
            <span class="block text-sm mt-1 text-gray-500 italic">I segmenti sono mostrati nell'ordine corretto della norma.</span>
        </p>
        

        <!-- Area dei Segmenti DRAGGABILI -->
        <div id="segments-area" class="space-y-4 mb-8 min-h-[220px] flex flex-col items-center justify-center pt-4">
            <!-- I segmenti sono mostrati nell'ordine in cui compaiono nella frase -->
            <span id="segment1" class="segment segment-default" draggable="true" ondragstart="drag(event)"></span>
            <span id="segment2" class="segment segment-default" draggable="true" ondragstart="drag(event)"></span>
        </div>
    
        <!-- Area di Scelta del Tipo (DROP TARGETS) -->
        <div id="type-selection" class="flex flex-col space-y-4 pt-4 border-t">
            <!-- Aggiunto ondragover, ondragleave e ondrop -->
            <button id="precetto-btn"
                    class="type-btn drop-target bg-blue-500 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition duration-150 ease-in-out transform hover:scale-[1.01]"
                    ondragover="allowDrop(event, 'precetto')" ondragleave="dragLeave(event)" ondrop="drop(event, 'precetto')">
                PRECETTO (L'azione/Dovere)
            </button>
            <button id="sanzione-btn"
                    class="type-btn drop-target bg-yellow-500 text-gray-800 font-bold py-4 px-6 rounded-xl shadow-lg transition duration-150 ease-in-out transform hover:scale-[1.01]"
                    ondragover="allowDrop(event, 'sanzione')" ondragleave="dragLeave(event)" ondrop="drop(event, 'sanzione')">
                SANZIONE (La Conseguenza)
            </button>
        </div>


        <!-- Messaggio di Feedback -->
        <div id="feedback-message" class="text-center text-xl font-bold mt-8 min-h-[30px]"></div>

        <!-- Area del Punteggio e Progresso -->
        <div class="mt-8 pt-4 border-t flex justify-between items-center text-gray-700">
            <span id="score-display" class="text-xl font-bold text-indigo-700">Corrette (Senza Errori): 0</span>
            <span id="progress-display" class="text-sm font-medium">Frase 0 di 10</span>
        </div>

    </div>

    <!-- Modale Risultati -->
    <div id="results-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md text-center">
            <h2 class="text-3xl font-extrabold text-indigo-700 mb-4">Attività Completata!</h2>
            
            <p id="final-score-text" class="text-2xl font-semibold text-gray-800 mb-2">Risultato: 0 / 10</p>
            <p id="final-message" class="text-lg text-gray-600 mb-8"></p>

            <button onclick="restartQuiz()"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition duration-150 ease-in-out transform hover:scale-[1.03]">
                Riprova
            </button>
        </div>
    </div>


    <script>
        const sentences = [
            // STRUTTURA: PRECETTO | SANZIONE (P-S)
            {
                full: "Chi vende prodotti contraffatti (falsi) rischia il sequestro della merce e una multa salata.",
                precetto: "Chi vende prodotti contraffatti (falsi)",
                sanzione: "rischia il sequestro della merce e una multa salata."
            },
            // STRUTTURA: SANZIONE | PRECETTO (S-P)
            {
                full: "Una sanzione amministrativa viene subita da chi, proprietario di un cane, non raccoglie i bisogni in luogo pubblico.",
                precetto: "chi, proprietario di un cane, non raccoglie i bisogni in luogo pubblico.",
                sanzione: "Una sanzione amministrativa viene subita da"
            },
            // STRUTTURA: PRECETTO | SANZIONE (P-S)
            {
                full: "Chi usa il telefono cellulare mentre guida l'auto subisce una decurtazione di punti dalla patente e una multa.",
                precetto: "Chi usa il telefono cellulare mentre guida l'auto",
                sanzione: "subisce una decurtazione di punti dalla patente e una multa."
            },
            // STRUTTURA: SANZIONE | PRECETTO (S-P)
            {
                full: "Le sanzioni penali e amministrative colpiscono il datore di lavoro che non garantisce le misure di sicurezza.",
                precetto: "il datore di lavoro che non garantisce le misure di sicurezza.",
                sanzione: "Le sanzioni penali e amministrative colpiscono"
            },
            // STRUTTURA: PRECETTO | SANZIONE (P-S)
            {
                full: "Chi non si ferma all'alt della Polizia Stradale commette un reato ed è punito secondo la legge.",
                precetto: "Chi non si ferma all'alt della Polizia Stradale",
                sanzione: "commette un reato ed è punito secondo la legge."
            },
            // STRUTTURA: SANZIONE | PRECETTO (S-P)
            {
                full: "L'obbligo di risarcire il danno e una possibile pena detentiva scatta per chi danneggia una proprietà pubblica intenzionalmente.",
                precetto: "chi danneggia una proprietà pubblica intenzionalmente.",
                sanzione: "L'obbligo di risarcire il danno e una possibile pena detentiva scatta per"
            },
            // STRUTTURA: PRECETTO | SANZIONE (P-S)
            {
                full: "Un cittadino che non paga le tasse entro la scadenza prevista è soggetto a sanzioni pecuniarie (multe) e interessi di mora.",
                precetto: "Un cittadino che non paga le tasse entro la scadenza prevista",
                sanzione: "è soggetto a sanzioni pecuniarie (multe) e interessi di mora."
            },
            // STRUTTURA: SANZIONE | PRECETTO (S-P)
            {
                full: "La condanna alla reclusione e alla confisca dei beni è la conseguenza per l'amministratore che sottrae fondi aziendali.",
                precetto: "l'amministratore che sottrae fondi aziendali.",
                sanzione: "La condanna alla reclusione e alla confisca dei beni è la conseguenza per"
            },
            // STRUTTURA: PRECETTO | SANZIONE (P-S)
            {
                full: "Chi getta rifiuti in aree non autorizzate (discariche abusive) riceve una multa che può arrivare fino a 20.000 euro.",
                precetto: "Chi getta rifiuti in aree non autorizzate (discariche abusive)",
                sanzione: "riceve una multa che può arrivare fino a 20.000 euro."
            },
            // STRUTTURA: SANZIONE | PRECETTO (S-P)
            {
                full: "La sospensione dell'attività e l'obbligo di bonifica sono applicati all'azienda che inquina un corso d'acqua con sostanze chimiche.",
                precetto: "azienda che inquina un corso d'acqua con sostanze chimiche.",
                sanzione: "La sospensione dell'attività e l'obbligo di bonifica sono applicati all'"
            }
        ];
        
        let currentSentenceIndex = 0;
        let score = 0;
        const totalSentences = sentences.length;

        // Elementi DOM
        const segment1Element = document.getElementById('segment1');
        const segment2Element = document.getElementById('segment2');
        const precettoBtn = document.getElementById('precetto-btn');
        const sanzioneBtn = document.getElementById('sanzione-btn');
        const feedbackMessage = document.getElementById('feedback-message');
        const scoreDisplay = document.getElementById('score-display');
        const progressDisplay = document.getElementById('progress-display');
        const resultsModal = document.getElementById('results-modal');
        const finalScoreText = document.getElementById('final-score-text');
        const finalMessage = document.getElementById('final-message');

        // Stato interno della frase corrente
        let currentSegments = []; // [ {text, type, id, element} ]
        let currentSentenceState = { precettoAssigned: false, sanzioneAssigned: false };
        let errorOccurredInSentence = false; 

        // --- Gestione Drag & Drop ---

        function drag(ev) {
            // Salva l'ID del segmento trascinato (1 o 2)
            const segmentId = ev.target.id === 'segment1' ? 1 : 2;
            ev.dataTransfer.setData("text/plain", segmentId);
            
            // Feedback visivo
            ev.currentTarget.classList.add('opacity-50');
        }

        function allowDrop(ev, targetType) {
            ev.preventDefault();
            const targetButton = document.getElementById(`${targetType}-btn`);
            
            if (!currentSentenceState[targetType + 'Assigned']) {
                 targetButton.classList.add('ring-4', 'ring-indigo-300');
            }
        }

        function dragLeave(ev) {
            if (ev.target.tagName === 'BUTTON') {
                 ev.target.classList.remove('ring-4', 'ring-indigo-300');
            }
        }

        function drop(ev, assignedType) {
            ev.preventDefault();
            
            const targetButton = ev.currentTarget;
            const segmentId = parseInt(ev.dataTransfer.getData("text/plain"));
            const segmentElement = document.getElementById(`segment${segmentId}`);
            
            // Pulisce il feedback di trascinamento e drop
            segmentElement.classList.remove('opacity-50');
            targetButton.classList.remove('ring-4', 'ring-indigo-300');
            
            // Trova i dati corretti per il segmento trascinato (ID 1 o 2)
            const segmentData = currentSegments.find(s => s.id === segmentId);
            const correctType = segmentData.type; 
            const isCorrect = assignedType === correctType;
            
            // Controlla se lo slot è già occupato
            if (currentSentenceState[assignedType + 'Assigned']) {
                 feedbackMessage.textContent = `Hai già assegnato la categoria ${assignedType.toUpperCase()}.`;
                 feedbackMessage.classList.remove('text-green-600');
                 feedbackMessage.classList.add('text-red-600');
                 return;
            }

            if (isCorrect) {
                // 1. Successo: aggiorna lo stato e nascondi
                currentSentenceState[assignedType + 'Assigned'] = true;
                segmentElement.style.display = 'none'; // Nasconde il segmento

                // Aggiorna il bottone per mostrare che è completo
                targetButton.classList.remove('bg-blue-500', 'bg-yellow-500', 'text-gray-800', 'text-white');
                targetButton.classList.add('target-filled');
                targetButton.textContent = `${assignedType.toUpperCase()} ASSEGNATO`;

                feedbackMessage.textContent = `Corretto! Hai assegnato il ${assignedType.toUpperCase()}.`;
                feedbackMessage.classList.remove('text-red-600');
                feedbackMessage.classList.add('text-green-600');

                // 2. Controllo completamento della frase
                if (currentSentenceState.precettoAssigned && currentSentenceState.sanzioneAssigned) {
                    
                    let resultMessage = "COMPLETO! Ottima distinzione!";
                    
                    if (!errorOccurredInSentence) {
                        score++; // Incrementa il punteggio SOLO se non ci sono stati errori
                        resultMessage = "FANTASTICO! Completato Senza Errori! (Punto Assegnato)";
                    } else {
                        resultMessage = "COMPLETO. Questa frase non conta per il punteggio (hai commesso un errore).";
                    }

                    scoreDisplay.textContent = `Corrette (Senza Errori): ${score}`;
                    feedbackMessage.textContent = resultMessage;
                    
                    // Procedi alla prossima frase dopo un ritardo
                    setTimeout(nextSentence, 1500); 
                }

            } else {
                // 3. Errore: feedback, traccia l'errore e reset visivo
                errorOccurredInSentence = true; // Imposta lo stato di errore per la frase
                segmentElement.classList.add('segment-error');
                segmentElement.setAttribute('draggable', 'false');

                feedbackMessage.textContent = `Sbagliato. Questo è un ${correctType.toUpperCase()}. Riprova.`;
                feedbackMessage.classList.remove('text-green-600');
                feedbackMessage.classList.add('text-red-600');

                // Resetta visivamente il segmento dopo un breve ritardo per l'effetto errore
                setTimeout(() => {
                    segmentElement.classList.remove('segment-error');
                    segmentElement.setAttribute('draggable', 'true');
                    feedbackMessage.textContent = '';
                }, 1000);
            }
        }

        // --- Funzioni di Controllo Quiz ---

        // Gestisce la transizione alla frase successiva
        function nextSentence() {
            document.getElementById('segments-area').classList.add('opacity-0');
            
            setTimeout(() => {
                currentSentenceIndex++;
                if (currentSentenceIndex >= totalSentences) {
                    showResults();
                } else {
                    loadSentence();
                    document.getElementById('segments-area').classList.remove('opacity-0');
                }
            }, 500);
        }

        // Funzione per caricare la prossima frase (con ordine fisso)
        function loadSentence() {
            if (currentSentenceIndex >= totalSentences) {
                showResults();
                return;
            }

            const currentSentenceData = sentences[currentSentenceIndex];
            currentSentenceState = { precettoAssigned: false, sanzioneAssigned: false };
            errorOccurredInSentence = false; 

            let firstSegmentData;
            let secondSegmentData;

            // DETERMINAZIONE DELL'ORDINE FISSO: 
            // La parte che inizia la frase completa (e quindi con la maiuscola) va in segment1.
            if (currentSentenceData.full.startsWith(currentSentenceData.precetto)) {
                // Ordine Precetto, Sanzione
                firstSegmentData = { text: currentSentenceData.precetto, type: 'precetto', id: 1, element: segment1Element };
                secondSegmentData = { text: currentSentenceData.sanzione, type: 'sanzione', id: 2, element: segment2Element };
            } else {
                // Ordine Sanzione, Precetto
                firstSegmentData = { text: currentSentenceData.sanzione, type: 'sanzione', id: 1, element: segment1Element };
                secondSegmentData = { text: currentSentenceData.precetto, type: 'precetto', id: 2, element: segment2Element };
            }

            // Assegna il testo agli elementi DOM
            segment1Element.textContent = firstSegmentData.text;
            segment2Element.textContent = secondSegmentData.text;

            // Aggiorna lo stato interno dei segmenti
            currentSegments = [firstSegmentData, secondSegmentData];
            
            // Resetta lo stato visivo degli elementi
            [segment1Element, segment2Element].forEach(el => {
                el.classList.remove('segment-correct', 'segment-error', 'dimmed', 'opacity-50');
                el.classList.add('segment-default');
                el.style.display = 'block';
                el.setAttribute('draggable', 'true');
            });

            // Resetta i bottoni
            precettoBtn.classList.remove('target-filled', 'bg-yellow-500', 'text-gray-800');
            precettoBtn.classList.add('bg-blue-500', 'text-white');
            precettoBtn.textContent = 'PRECETTO (L\'azione/Dovere)';
            precettoBtn.ondrop = (e) => drop(e, 'precetto');

            sanzioneBtn.classList.remove('target-filled', 'bg-blue-500', 'text-white');
            sanzioneBtn.classList.add('bg-yellow-500', 'text-gray-800');
            sanzioneBtn.textContent = 'SANZIONE (La Conseguenza)';
            sanzioneBtn.ondrop = (e) => drop(e, 'sanzione');

            feedbackMessage.textContent = '';

            // Aggiorna progresso
            scoreDisplay.textContent = `Corrette (Senza Errori): ${score}`;
            progressDisplay.textContent = `Frase ${currentSentenceIndex + 1} di ${totalSentences}`;
        }

        // Funzione per generare il feedback finale
        function getFinalFeedback(finalScore) {
            if (finalScore === totalSentences) {
                return "Perfetto! 10 su 10! Hai una comprensione chiara e precisa della struttura delle norme giuridiche, senza commettere alcun errore.";
            } else if (finalScore >= 7) {
                return "Ottimo lavoro! La distinzione è quasi perfetta. Riprova per centrare il 100% di precisione!";
            } else if (finalScore >= 4) {
                 return "Ben fatto! Hai compreso la maggior parte delle distinzioni. Ricorda che ogni errore annulla il punto per la frase. Riprova per maggiore precisione.";
            }
            else {
                return "Buon inizio! Ricorda: il Precetto è **cosa** non fare; la Sanzione è la **conseguenza** se lo fai. Riprova per migliorare!";
            }
        }

        // Funzione per mostrare i risultati finali
        function showResults() {
            finalScoreText.textContent = `Risultato: ${score} / ${totalSentences}`;
            finalMessage.textContent = getFinalFeedback(score); 
            resultsModal.classList.remove('hidden');
            resultsModal.classList.add('flex');
        }

        // Funzione per riavviare il quiz
        function restartQuiz() {
            // Mescola le frasi all'inizio
            for (let i = sentences.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sentences[i], sentences[j]] = [sentences[j], sentences[i]];
            }

            currentSentenceIndex = 0;
            score = 0;
            resultsModal.classList.add('hidden');
            resultsModal.classList.remove('flex');
            
            document.getElementById('segments-area').classList.remove('opacity-0');
            loadSentence();
        }

        // Inizializza l'attività
        document.addEventListener('DOMContentLoaded', restartQuiz);
    </script>
</body>
</html>
